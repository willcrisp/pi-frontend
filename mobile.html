<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app can paint under the status/gesture bars and
         reclaim that space with env(safe-area-inset-*); user-scalable=no because
         a double-tap zoom on a chat transcript is never intentional. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>radius</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mobile/main.js"></script>
  </body>
</html>
